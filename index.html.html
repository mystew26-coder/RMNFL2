      /* Animations */
      @keyframes pulse-live { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.2)} }

      @keyframes ticker-scroll { 0%{transform:translateX(100%)} 100%{transform:translateX(-200%)} }
      .ticker-text { animation: ticker-scroll 60s linear infinite; white-space: nowrap; display: inline-block; }

      .nav-link { position: relative; padding: 8px 12px; border-radius: 6px; transition: all 0.2s; cursor: pointer; font-size: 12px; font-weight: 500; color: #94a3b8; white-space: nowrap; display: flex; align-items: center; gap: 4px; min-height: 36px; }

      .nav-link.active { color: #DC2626; background: rgba(220,38,38,0.1); }

      /* Buttons */
      .tab-btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #94a3b8; cursor: pointer; border: none; background: transparent; transition: all 0.2s; min-height: 40px; }
      .tab-btn:hover { color: #fff; }
      .tab-btn.active { color: #fff; background: #DC2626; }
      .btn-primary { background: #DC2626; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; transition: all 0.2s; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      .btn-primary:hover { background: #B91C1C; }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; font-size: 13px; transition: all 0.2s; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

      .btn-gold { background: #F59E0B; color: #0a0e1a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
      .btn-gold:hover { background: #FBBF24; }

      /* Forms */
      input, select, textarea { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 16px; font-family: 'Inter', sans-serif; width: 100%; transition: border-color 0.2s; min-height: 44px; }

      /* Badges */
      .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1; white-space: nowrap; }

      .badge-green { background: rgba(34,197,94,0.2); color: #86efac; }
      .badge-gold { background: rgba(245,158,11,0.2); color: #FCD34D; }
      .badge-blue { background: rgba(59,130,246,0.2); color: #93c5fd; }
      .badge-gray { background: rgba(148,163,184,0.15); color: #94a3b8; }
      .badge-purple { background: rgba(168,85,247,0.2); color: #c4b5fd; }

      /* Toast */
      .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 48px); }
      .toast { padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; color: #fff; opacity: 0; transform: translateX(30px); animation: toastIn 0.3s ease forwards; min-width: 220px; max-width: 100%; }
      .toast.removing { animation: toastOut 0.3s ease forwards; }
      @keyframes toastIn { to { opacity:1; transform:translateX(0); } }
      @keyframes toastOut { to { opacity:0; transform:translateX(30px); } }
      .toast-success { background: rgba(34,197,94,0.9); }
      .toast-error { background: rgba(220,38,38,0.9); }
      .toast-info { background: rgba(59,130,246,0.9); }

      /* Modal */
      .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px; }
      .modal-content { background:#0f1425;border:1px solid rgba(255,255,255,0.1);border-radius:16px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;position:relative; }
      @media (min-width:768px) { .modal-content { padding: 32px; } }

      /* Tables */
      table { width: 100%; border-collapse: collapse; }
      th { text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }
      td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }

      /* Utility */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .team-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }
      .step-badge { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
      .channel-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.03); transition: background 0.2s; }
      .channel-row:hover { background: rgba(255,255,255,0.06); }
      .copy-box { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: border-color 0.2s; }
      .copy-box:hover { border-color: #DC2626; }

      /* Mobile menu */
      .mobile-menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
      .mobile-menu-overlay.open { opacity: 1; pointer-events: auto; }
      .mobile-menu-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 280px; max-width: 85vw; background: #0f1425; border-left: 1px solid rgba(255,255,255,0.08); z-index: 100; transform: translateX(100%); transition: transform 0.3s ease; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
      .mobile-menu-drawer.open { transform: translateX(0); }
      .mobile-nav-link { padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #94a3b8; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; min-height: 44px; }

      .mobile-nav-link.active { color: #DC2626; background: rgba(220,38,38,0.1); }

      .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

      .score-card { flex: 0 0 180px; min-width: 180px; }

        .nav-link { font-size: 11px; padding: 6px 8px; }
        .tab-btn { padding: 6px 12px; font-size: 12px; min-height: 36px; }
      }
    </style>

    function renderStandings() {
      return `<div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-6 md:py-8">

    function renderStandingsContent(conf='AFC') {
      const container = document.getElementById('standings-content-sc01');
      if(!container) return;
      const divisions = conf==='AFC'?['AFC East','AFC North','AFC South','AFC West']:['NFC East','NFC North','NFC South','NFC West'];
      let html='';
      divisions.forEach(div=>{
        const teams = TEAMS_DATA.filter(t=>t.div===div).sort((a,b)=>{
          const rA=STATE.records[a.abbr]||{w:0,l:0,t:0},rB=STATE.records[b.abbr]||{w:0,l:0,t:0};
          const totalA = rA.w+rA.l||1, totalB = rB.w+rB.l||1;
          const pctA=rA.w/totalA, pctB=rB.w/totalB;
          return pctB-pctA;
        });
        html+=`<div class="glass-card p-4 mb-4">
          <h3 class="font-display text-lg text-gold-400 mb-3">${div.toUpperCase()}</h3>
          <div class="overflow-x-auto -mx-4 px-4 sm:mx-0 sm:px-0"><table>
            <thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>T</th><th>PCT</th><th>PF</th><th>PA</th><th>Owner</th></tr></thead>
            <tbody>${teams.map((t,i)=>{
              const r=STATE.records[t.abbr]||{w:0,l:0,t:0};
              const total = r.w+r.l||1;
              const pct=(r.w/total).toFixed(3);
              const owner=STATE.owners[t.abbr];
              return `<tr class="${i===0?'bg-white/5':''}">
                <td class="text-gray-500 tabular-nums">${i+1}</td>
                <td><span class="flex items-center gap-2"><span class="team-dot" style="background:${t.c1}"></span><span class="text-white font-medium">${t.name}</span></span></td>
                <td class="text-white font-mono tabular-nums">${r.w}</td><td class="text-white font-mono tabular-nums">${r.l}</td><td class="text-white font-mono tabular-nums">${r.t}</td>
                <td class="text-gray-400 font-mono tabular-nums">${pct}</td>
                <td class="text-gray-400 font-mono tabular-nums">${STATE.ptsFor[t.abbr]||0}</td><td class="text-gray-400 font-mono tabular-nums">${STATE.ptsAgainst[t.abbr]||0}</td>
                <td class="text-gray-400 text-xs">${owner?esc(owner.name):'<span class="text-yellow-500">AVAILABLE</span>'}</td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>
        </div>`;
      });
      const allConf = TEAMS_DATA.filter(t=>t.conf===conf).sort((a,b)=>{
        const rA=STATE.records[a.abbr]||{w:0,l:0},rB=STATE.records[b.abbr]||{w:0,l:0};
        const totalA = rA.w+rA.l||1, totalB = rB.w+rB.l||1;
        return (rB.w/totalB)-(rA.w/totalA);
      });
      const wcTeams = allConf.slice(4,7);
      html+=`<div class="glass-card p-4">
        <h3 class="font-display text-lg text-bred-500 mb-3">WILD CARD PICTURE</h3>
        <div class="space-y-2">
          ${wcTeams.map((t,i)=>{const r=STATE.records[t.abbr]||{w:0,l:0};return `<div class="flex items-center justify-between glass-card-light p-3">
            <span class="flex items-center gap-2"><span class="text-xs text-gray-500 tabular-nums">#${i+5}</span><span class="team-dot" style="background:${t.c1}"></span><span class="text-sm text-white">${t.name}</span></span>
            <span class="text-xs text-gray-400 font-mono tabular-nums">${r.w}-${r.l}</span>
          </div>`;}).join('')}
        </div>
      </div>`;
      container.innerHTML=html;
    }

    function renderNewsGrid(filter='ALL') {

      const catHeaderColors = {'PRE-GAME':'#3B82F6','POST-GAME':'#22C55E','COMMISSIONER':'#8B5CF6','HIGHLIGHT':'#F59E0B','BREAKING':'#DC2626'};
      let articles = STATE.articles.slice();
      if(filter!=='ALL') articles=articles.filter(a=>a.category===filter);

        {id:'s7',title:'Free Agency & Auction Rules',body:'Free agency opens after the draft. Owners may bid on free agents using their salary cap space. Minimum bid: $500K. Bidding wars last 24 hours from the last bid. Owners may sign up to 3 free agents per week during the regular season.'},

        {id:'s9',title:'Conduct Code & Sportsmanship',body:'All owners must conduct themselves with respect and sportsmanship at all times. No trash talk that crosses the line into personal attacks, discrimination, or harassment. Game manipulation, stat padding, or intentional tanking is strictly prohibited. Running up the score (leading by 21+ in the 4th quarter and still passing) is considered unsportsmanlike.'},
        {id:'s10',title:'Communication Policy',body:'All league communication must go through official Discord channels. Owners must respond to DMs from the Commissioner within 24 hours. Game scheduling must occur in the designated scheduling channel. Public complaints about league decisions should be directed to the appeals process, not aired publicly.'},
        {id:'s11',title:'Streaming & Media Requirements',body:'Owners must stream at least 2 games per season on the RMNFL YouTube channel or their own Twitch/YouTube. Game of the Week participants are required to stream. All streams must be family-friendly with no explicit content. Highlights may be submitted to the media team for the weekly Top Plays segment.'},
        {id:'s12',title:'Discord Requirements',body:'All owners must join and remain active on the RMNFL Discord server. Mandatory channels: #announcements, #scheduling, #scores, #general. Owners inactive for 7+ days without notice will receive a warning. Discord roles will be assigned by the admin team.'},
        {id:'s13',title:'Strike System',body:'The RMNFL uses a 3-strike system:\n• Strike 1: Warning + fine\n• Strike 2: Suspension (1-3 games) + fine\n• Strike 3: Permanent removal from the league\n\nStrikes reset at the start of each new season. The Commissioner has discretion to issue strikes for any violation of league rules.'},

    function attachAppealFormEvents() {
      const stmt=document.getElementById('appeal-stmt-as01');
      const wc=document.getElementById('appeal-wc-aw01');
      if(stmt&&wc) stmt.addEventListener('input',()=>{const words=stmt.value.trim().split(/\s+/).filter(w=>w.length>0).length;wc.textContent=words;wc.style.color=words>=100?'#22c55e':'#94a3b8';});
      const form=document.getElementById('appeal-form-af01');
      if(form) form.addEventListener('submit',e=>{
        e.preventDefault();
        const words=(document.getElementById('appeal-stmt-as01').value||'').trim().split(/\s+/).filter(w=>w.length>0).length;
        if(words<100){showToast('Appeal statement must be at least 100 words.','error');return;}
        if(!document.getElementById('appeal-decl-dl01').checked){showToast('You must check the declaration.','error');return;}
        STATE.appeals.push({
          id:'ap'+Date.now(),name:document.getElementById('appeal-name-an01').value,
          team:document.getElementById('appeal-team-at01').value,type:document.getElementById('appeal-type-ay01').value,
          statement:document.getElementById('appeal-stmt-as01').value,date:new Date().toISOString().split('T')[0],status:'PENDING'
        });
        saveState();
        showToast('Appeal submitted! You will receive a response within 48 hours via Discord.','success');
        form.reset(); document.getElementById('appeal-wc-aw01').textContent='0';
      });
    }

    // ===== EVENT ATTACHMENTS =====
    function attachViewEvents(view) {
      switch(view) {
        case 'home':
          document.querySelectorAll('[data-article-id]').forEach(el=>el.addEventListener('click',()=>openArticleModal(el.dataset.articleId)));
          const djBtn=document.getElementById('discord-join-btn-dj01');
          if(djBtn) djBtn.addEventListener('click',()=>showToast('Opening Discord invite...','info'));
          break;

        case 'teams':
          renderTeamsGrid();
          document.querySelectorAll('[data-conf-filter]').forEach(btn=>btn.addEventListener('click',()=>{
            document.querySelectorAll('[data-conf-filter]').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            const divActive=document.querySelector('[data-div-filter].active');
            renderTeamsGrid(btn.dataset.confFilter,divActive?.dataset.divFilter||'All Divisions');
          }));
          document.querySelectorAll('[data-div-filter]').forEach(btn=>btn.addEventListener('click',()=>{
            document.querySelectorAll('[data-div-filter]').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            const confActive=document.querySelector('[data-conf-filter].active');
            renderTeamsGrid(confActive?.dataset.confFilter||'ALL',btn.dataset.divFilter);
          }));
          break;

        case 'team-detail':
          const backBtn=document.getElementById('back-teams-bt01');
          if(backBtn) backBtn.addEventListener('click',()=>navigate('teams'));
          break;

        case 'schedule':
          renderScheduleGames(STATE.currentWeek);
          document.querySelectorAll('[data-week-tab]').forEach(btn=>{
            btn.addEventListener('click',()=>{
              document.querySelectorAll('[data-week-tab]').forEach(b=>b.classList.remove('active'));
              btn.classList.add('active');
              const wk=isNaN(Number(btn.dataset.weekTab))?btn.dataset.weekTab:parseInt(btn.dataset.weekTab);
              renderScheduleGames(wk);
            });
          });
          const gpBtn=document.getElementById('gen-pregame-btn-gp01');
          if(gpBtn) gpBtn.addEventListener('click',()=>generatePreGameArticles(STATE.currentWeek));
          const goBtn=document.getElementById('gen-postgame-btn-go01');
          if(goBtn) goBtn.addEventListener('click',()=>generatePostGameArticles(STATE.currentWeek));
          break;

        case 'standings':
          renderStandingsContent('AFC');
          document.querySelectorAll('[data-standings-conf]').forEach(btn=>btn.addEventListener('click',()=>{
            document.querySelectorAll('[data-standings-conf]').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            renderStandingsContent(btn.dataset.standingsConf);
          }));
          break;

        case 'media':
          renderMediaContent('LIVE');
          document.querySelectorAll('[data-media-tab]').forEach(btn=>btn.addEventListener('click',()=>{
            document.querySelectorAll('[data-media-tab]').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            renderMediaContent(btn.dataset.mediaTab);
          }));
          break;

    // ===== AI ARTICLE GENERATION =====
    async function generatePreGameArticles(week) {
      const games = (STATE.schedule[week]||[]).filter(g=>g.status==='UPCOMING');
      if(!games.length){showToast('No upcoming games to generate articles for.','info');return;}
      const statusEl=document.getElementById('ai-gen-status-gs01');
      const msgEl=document.getElementById('ai-gen-msg-gm01');
      if(statusEl) statusEl.classList.remove('hidden');

      let generated = 0;
      for(let i=0;i<Math.min(games.length,3);i++) {
        const g=games[i];
        const awayName=teamName(g.away), homeName=teamName(g.home);
        const awayRec=STATE.records[g.away]||{w:0,l:0}, homeRec=STATE.records[g.home]||{w:0,l:0};
        const awayOwner=STATE.owners[g.away]?.name||'TBD', homeOwner=STATE.owners[g.home]?.name||'TBD';
        if(msgEl) msgEl.textContent=`Generating preview ${i+1}/${Math.min(games.length,3)}: ${awayName} vs ${homeName}...`;

        try {
          if(window.AppSDK?.ai?.chat) {
            const result = await AppSDK.ai.chat({
              messages: [{
                role: 'user',
                content: `Write a professional RMNFL Madden simulation league pre-game preview article for Week ${week}: ${awayName} (${awayRec.w}-${awayRec.l}) at ${homeName} (${homeRec.w}-${homeRec.l}). Owner: ${awayOwner} vs ${homeOwner}. Include matchup analysis, key players to watch, prediction with score. Make it exciting and ESPN-style. 200-250 words. Do not include a title — just the article body.`
              }]
            });
            if(result && result.content) {
              STATE.articles.unshift({
                id:'a'+Date.now()+'_'+i,
                title:`${awayName} at ${homeName}: Week ${week} Preview`,
                category:'PRE-GAME',author:'RMNFL AI Media',
                date:new Date().toISOString().split('T')[0],
                body:result.content,teams:[g.away,g.home],pinned:false
              });
              generated++;
            }
          } else {
            showToast('AI generation not available.','error');
            break;
          }
        } catch(e) {
          showToast(`Failed to generate article for ${awayName} vs ${homeName}.`,'error');
        }
      }
      saveState();
      if(statusEl) statusEl.classList.add('hidden');
      if(generated > 0) showToast(`${generated} pre-game article(s) generated!`,'success');
      if(currentView==='admin') renderAdminContent('Article Mgr');
    }

    async function generatePostGameArticles(week) {
      const games = (STATE.schedule[week]||[]).filter(g=>g.status==='FINAL');
      if(!games.length){showToast('No completed games to generate recaps for.','info');return;}
      const statusEl=document.getElementById('ai-gen-status-gs01');
      const msgEl=document.getElementById('ai-gen-msg-gm01');
      if(statusEl) statusEl.classList.remove('hidden');

      let generated = 0;
      for(let i=0;i<Math.min(games.length,3);i++) {
        const g=games[i];
        const winner=g.scoreA>g.scoreH?g.away:g.home;
        const loser=g.scoreA>g.scoreH?g.home:g.away;
        const wScore=Math.max(g.scoreA,g.scoreH), lScore=Math.min(g.scoreA,g.scoreH);
        if(msgEl) msgEl.textContent=`Generating recap ${i+1}/${Math.min(games.length,3)}: ${teamName(winner)} vs ${teamName(loser)}...`;

        try {
          if(window.AppSDK?.ai?.chat) {
            const result = await AppSDK.ai.chat({
              messages: [{
                role: 'user',
                content: `Write a professional RMNFL Madden simulation league post-game recap for Week ${week}: ${teamName(winner)} defeated ${teamName(loser)} ${wScore}-${lScore}. Include game summary, standout performances, key moments, and what this means for the standings. ESPN-style. 200-250 words. Do not include a title — just the article body.`
              }]
            });
            if(result && result.content) {
              STATE.articles.unshift({
                id:'a'+Date.now()+'_'+i,
                title:`${teamName(winner)} Defeats ${teamName(loser)} ${wScore}-${lScore} — Week ${week} Recap`,
                category:'POST-GAME',author:'RMNFL AI Media',
                date:new Date().toISOString().split('T')[0],
                body:result.content,teams:[winner,loser],pinned:false
              });
              generated++;
            }
          } else {
            showToast('AI generation not available.','error');
            break;
          }
        } catch(e) {
          showToast('Failed to generate recap.','error');
        }
      }
      saveState();
      if(statusEl) statusEl.classList.add('hidden');
      if(generated > 0) showToast(`${generated} post-game recap(s) generated!`,'success');
      if(currentView==='admin') renderAdminContent('Article Mgr');
    }

    async function generateCommPost() {
      const prompt = document.getElementById('ai-comm-prompt-cp01')?.value;
      if(!prompt){showToast('Enter a topic/prompt.','error');return;}
      const cdBtn=document.getElementById('ai-comm-draft-cd01');
      if(cdBtn){cdBtn.disabled=true;cdBtn.textContent='Drafting...';}
      try {
        if(window.AppSDK?.ai?.chat) {
          const result = await AppSDK.ai.chat({
            messages: [{
              role: 'user',
              content: `You are the Commissioner of the RMNFL (Rocky Mountain NFL) Madden simulation league. Write a commissioner announcement post about: ${prompt}. Make it professional, authoritative, and clear. 150-200 words. Do not include a title.`
            }]
          });
          if(result && result.content) {
            STATE.articles.unshift({
              id:'a'+Date.now(),title:'Commissioner Announcement: '+prompt,category:'COMMISSIONER',
              author:'Commissioner',date:new Date().toISOString().split('T')[0],body:result.content,teams:[],pinned:true
            });
            saveState();showToast('Commissioner post drafted and published!','success');
            renderAdminContent('Article Mgr');
          }
        } else {
          showToast('AI generation not available.','error');
        }
      } catch(e) {showToast('Failed to generate post.','error');}
      if(cdBtn){cdBtn.disabled=false;cdBtn.innerHTML='<i data-lucide="sparkles" class="w-3 h-3"></i>AI Draft Commissioner Post';refreshIcons();}
    }

    // ===== INIT =====
    async function initApp() {
      await loadState();
      document.getElementById('logo-btn-lg01').addEventListener('click',()=>navigate('home'));
      buildNav();
      initTicker();
      renderView();
    }

    // Start app - wait for lucide to be ready if possible
    if(document.readyState==='loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
    </script>
  </body>
</html>
